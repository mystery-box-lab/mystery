<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Mauza</title>

<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background:
    linear-gradient(
      135deg,
      #0f172a 0%,
      #1e293b 50%,
      #334155 100%
    );

  overflow-x: hidden;
  color: #f8fafc;
}

.floating {
  position: fixed;
  top: -20px;
  color: rgba(255,255,255,0.7);
  animation: fall linear infinite;
  z-index: 0;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}
section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
      z-index: 1;
    }

   .card {
  background: rgba(15,23,42,0.55);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      padding: 40px;
      width: 90%;
      max-width: 850px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      animation: fadeIn 1.5s ease;
    }

    .cake-container {
      position: relative;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: floatCake 3s ease-in-out infinite;
    }

    .cake {
      font-size: 8rem;
      animation: glow 2s infinite alternate;
    }

    .number-candles {
      display: flex;
      gap: 25px;
      margin-bottom: -15px;
      z-index: 2;
      justify-content: center;
    }

    .number-candle {
      position: relative;
      width: 50px;
      height: 90px;
      background: linear-gradient(to bottom, #ff77aa, #ff4f8b);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
      animation: candleMove 2s ease-in-out infinite;
    }

    .flame {
      position: absolute;
      top: -20px;
      width: 16px;
      height: 24px;
      background: radial-gradient(circle, #fff6a9, #ffb300);
      border-radius: 50%;
      animation: flicker 0.2s infinite alternate;
      box-shadow: 0 0 20px #ffd54f;
    }
  
h1{
    text-align:center;
    margin-bottom:40px;
}

.gallery {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));

  gap: 20px;
}

.photo-card {

  background: rgba(15,23,42,0.55);

  backdrop-filter: blur(18px);

  border: 1px solid rgba(255,255,255,0.08);

  border-radius: 25px;

  overflow: hidden;

  transition: .4s;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

.photo-card:hover {

  transform:
    translateY(-8px) scale(1.03);

  box-shadow:
    0 20px 40px rgba(0,0,0,.4);
}

.photo-card img {

  width: 100%;

  height: 250px;

  object-fit: cover;

  display: block;
}

.photo-card .caption {

  padding: 20px;
}

.photo-card h3 {

  margin-bottom: 10px;
}

.photo-card p {

  opacity: .9;
  font-size: .95rem;
}

.gallery img{
    width:100%;
    border-radius:20px;
}

.card{
    margin-top:50px;
    background:rgba(255,255,255,0.08);
    padding:30px;
    border-radius:20px;
    text-align:center;
}

</style>
</head>
<body>

<div class="container">

<h1>Happy 19th Birthday Mauza 🌸</h1>

<div class="gallery">

<img src="foto1.png">
<img src="foto2.png">
<img src="foto3.png">
<img src="foto4.png">

</div>
    <div class="card">
      <h2>Happy 19th Birthday Mauza 🎂</h2>

      <div style="font-size: 7rem; margin-top:20px; animation: glow 1.5s infinite alternate;">
        🎂
      </div>

      <div style="font-size: 3rem; margin-top: -20px;">
        <div class="number-candles">
          <div class="number-candle">
            <div class="flame"></div>
            <span>1</span>
          </div>

          <div class="number-candle">
            <div class="flame"></div>
            <span>9</span>
          </div>
        </div>
      </div>

      <p style="margin-top:30px;">
        Finally, the special day has arrived 🌸<br><br>

        Happy birthday, Mauza.
        May your 19th year be filled with happiness,
        beautiful memories, and endless smiles ✨
      </p>
    </div>
<script>
for(let i = 0; i < 30; i++) {

  const flower = document.createElement('div');

  flower.classList.add('floating');

  const icons = ['✦','✧','❈','✺','✷'];

  flower.innerHTML =
    icons[Math.floor(Math.random() * icons.length)];

  flower.style.left = Math.random() * 100 + 'vw';

  flower.style.animationDuration =
    (5 + Math.random() * 10) + 's';

  flower.style.fontSize =
    (15 + Math.random() * 20) + 'px';

  document.body.appendChild(flower);
}
</script>
</body>
</html>
